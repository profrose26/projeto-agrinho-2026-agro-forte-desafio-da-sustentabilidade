<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🌾 Agro Forte, Futuro Sustentável 🌱</h1>

<p>
Administre sua propriedade rural equilibrando
produção e preservação ambiental.
</p>

<div class="painel">

<div class="card">
Produção
<h2 id="producao">50</h2>
</div>

<div class="card">
Meio Ambiente
<h2 id="ambiente">50</h2>
</div>

<div class="card">
Economia

</div>

<div class="pergunta" id="pergunta">
Como deseja irrigar sua lavoura?
</div>

<div class="acoes">

<button onclick="escolha('gotejamento')">
💧 Irrigação por Gotejamento
</button>

<button onclick="escolha('convencional')">
🚜 Irrigação Convencional
</button>

</div>

<div id="mensagem"></div>

</div>
